<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orient Kervan – Farbenland Köln</title><link rel="icon" href="logo_s.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#2a1a0c;--teal2:#4a3016;--turq:#a87420;--terra:#8e1620;--gold:#d9a441;--cream:#fbf6ec;--sand:#f2e6cf;--ink:#1f2a2e;--mut:#6b7477;--line:#e4dccd;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,.serif{font-family:Marcellus,Georgia,serif;font-weight:400}
button{font:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* top bar */
.topbar{background:#0b0805;color:#e9d9b8;font-size:13px}
.topbar .wrap{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding:7px 20px}
.topbar span::before{content:"✦ ";color:var(--gold)}
header{position:sticky;top:0;z-index:30;background:rgba(250,246,239,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:18px;height:70px}
.logo{display:flex;flex-direction:column;line-height:1;text-decoration:none;cursor:pointer}
.logo b{font-family:Marcellus,serif;font-weight:400;font-size:28px;color:var(--teal);letter-spacing:.5px}
.logo small{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--terra);margin-top:4px}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit}
.search input:focus{outline:2px solid var(--turq);border-color:transparent}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.langs{display:flex;gap:4px}
.langs button{border:1px solid transparent;background:none;border-radius:8px;padding:4px 6px;font-size:20px;line-height:1;opacity:.55}
.langs button.on{opacity:1;border-color:var(--line);background:#fff}
.cartbtn{position:relative;border:0;background:var(--teal);color:#fff;border-radius:999px;padding:10px 16px;display:flex;gap:8px;align-items:center;font-weight:500}
.cartbtn i{font-style:normal;background:var(--gold);color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:600}
/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 72% 50%,#5a3a12 0%,#22160a 45%,#0b0805 100%);color:#fff}
.hero .pat{position:absolute;inset:0;opacity:.13}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:56px 20px}
.hero h1{font-size:clamp(32px,4.4vw,54px);line-height:1.08;margin:0 0 14px}
.hero p{font-size:17px;max-width:520px;color:#e9d9b8;margin:0 0 26px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:600;background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mosaic img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:3px solid rgba(255,255,255,.15)}
.mosaic img:nth-child(2){transform:translateY(18px)}.mosaic img:nth-child(5){transform:translateY(18px)}
/* categories */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:40px 0 10px}
.cat{position:relative;border:0;padding:0;border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;background:var(--sand);text-align:left}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.cat:hover img{transform:scale(1.06)}
.cat span{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(60,6,10,.85));color:#fff;font-family:Marcellus,serif;font-size:18px}
.cat em{display:block;font-family:Inter;font-style:normal;font-size:12px;opacity:.8}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:34px 0 18px}
.toolbar h2{margin:0 auto 0 0;font-size:28px;color:var(--teal)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip b{font-weight:500;opacity:.6;margin-left:4px}
select,.tog{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px}
.tog{display:flex;gap:8px;align-items:center;cursor:pointer}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 10px 30px rgba(142,22,32,.16);transform:translateY(-2px)}
.card .ph{position:relative;aspect-ratio:1;background:var(--sand)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph img.b{position:absolute;inset:0;opacity:0;transition:opacity .3s}
.card:hover .ph img.b{opacity:1}
.badge{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;letter-spacing:.3px}
.badge.new{background:var(--terra)}
.card.so .ph img{filter:grayscale(.6);opacity:.7}
.card .bd{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .nm{font-size:14.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ct{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--turq);font-weight:600}
.card .pr{margin-top:auto;font-weight:600;font-size:16px;color:var(--teal)}
.card .pr small{font-weight:400;color:var(--mut);font-size:12px}
.card .pr s{color:var(--mut);font-weight:400;font-size:13px;margin-left:6px}
.empty{padding:60px;text-align:center;color:var(--mut)}
.more{display:block;margin:30px auto 0;background:#fff;border:1px solid var(--teal);color:var(--teal)}
/* info */
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:70px 0}
.info div{background:var(--sand);border-radius:var(--r);padding:24px}
.info h3{margin:0 0 6px;color:var(--teal);font-size:20px}
.info p{margin:0;color:#4b5559}
footer{background:#0b0805;color:#c9d1d3;padding:40px 0;font-size:14px}
footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}
footer b{color:#fff;font-family:Marcellus,serif;font-weight:400;font-size:22px}
footer h4{color:#fff;margin:0 0 10px;font-weight:500}
footer p{margin:4px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,30,35,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.modal{background:var(--cream);border-radius:18px;max-width:1000px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1.05fr 1fr;position:relative}
.x{position:absolute;top:12px;right:12px;border:0;background:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.gal{padding:18px;background:#fff}
.gal .main{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--sand)}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.6;border:2px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--turq)}
.det{padding:30px 28px}
.det h2{margin:6px 0 4px;font-size:27px;line-height:1.15;color:var(--teal)}
.det .sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.det .price{font-size:26px;font-weight:600;color:var(--terra);margin:8px 0 4px}
.det .tax{font-size:12px;color:var(--mut);margin-bottom:18px}
.det label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.vars{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.vars button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:13px}
.vars button.on{border-color:var(--teal);background:var(--teal);color:#fff}
.vars button.off{opacity:.45;text-decoration:line-through}
.buy{display:flex;gap:10px;margin-bottom:22px}
.qty{display:flex;border:1px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}
.qty button{border:0;background:none;width:38px;font-size:18px}
.qty span{width:32px;display:grid;place-items:center;font-weight:600}
.add{flex:1;border:0;border-radius:999px;background:var(--teal);color:#fff;font-weight:600;padding:13px}
.add:disabled{background:#9aa5a8;cursor:not-allowed}
.desc{font-size:14px;color:#3d474a;border-top:1px solid var(--line);padding-top:16px}
.desc p{margin:0 0 9px}
.note{font-size:12px;background:var(--sand);padding:8px 10px;border-radius:8px;color:var(--mut);margin-bottom:10px}
/* cart */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--cream);z-index:60;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.drawer header{position:static;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;height:auto}
.drawer header h3{margin:0;font-size:22px;color:var(--teal)}
.items{flex:1;overflow:auto;padding:10px 20px}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.it img{width:64px;height:64px;border-radius:8px;object-fit:cover}
.it .n{font-size:13.5px;font-weight:500;line-height:1.3}
.it .v{font-size:12px;color:var(--mut)}
.it .q{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:13px}
.it .q button{border:1px solid var(--line);background:#fff;border-radius:6px;width:24px;height:24px;line-height:1}
.it .p{font-weight:600;text-align:right}
.it .rm{border:0;background:none;color:var(--mut);font-size:12px;text-decoration:underline;padding:0}
.sum{padding:18px 20px;border-top:1px solid var(--line);background:#fff}
.sum .row{display:flex;justify-content:space-between;margin-bottom:6px}
.sum .tot{font-size:19px;font-weight:600}
.ship{font-size:12.5px;color:var(--teal2);margin:8px 0 12px}
.bar{height:6px;background:var(--sand);border-radius:6px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--turq)}
.checkout{display:block;text-align:center;text-decoration:none;background:var(--terra);color:#fff;border-radius:999px;padding:14px;font-weight:600}
.pay{font-size:11.5px;color:var(--mut);text-align:center;margin-top:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;z-index:70;transition:transform .3s;font-size:14px}
.toast.on{transform:translateX(-50%)}
@media(max-width:860px){
 .hero .wrap{grid-template-columns:1fr;padding:36px 20px}.mosaic{display:none}
 .cats{grid-template-columns:repeat(2,1fr)}.info,footer .wrap{grid-template-columns:1fr}
 .modal{grid-template-columns:1fr}.search{order:3;max-width:none;flex-basis:100%}
 header .wrap{flex-wrap:wrap;height:auto;padding:10px 20px;gap:10px}
 .cartbtn span{display:none}.logo b{font-size:23px}.langs{margin-left:auto}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
}

.tabs{display:flex;gap:4px;background:var(--sand);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--teal)}
.tabs button.on{background:var(--teal);color:#fff}
.lgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.lgrid .card .ph{aspect-ratio:2/3;background:#2a0609}
.lgrid .card .ph img{object-fit:cover}
.lsp{display:flex;gap:10px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.lsp b{color:var(--gold);font-weight:700;margin-right:2px}
.lbanner{margin:34px 0 0;border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr;background:linear-gradient(120deg,#0b0805,#3a2510);color:#fff;cursor:pointer}
.lbanner div{padding:30px 32px}.lbanner h3{font-size:30px;margin:0 0 8px;color:var(--gold2,#f0d79a)}.lbanner p{margin:0 0 16px;color:#e9d9b8}
.lbanner .imgs{display:flex;gap:8px;align-items:flex-end;justify-content:center;padding:18px}
.lbanner .imgs img{height:170px;border-radius:10px}
.inq{background:var(--sand);border-radius:12px;padding:14px 16px;font-size:14px;margin:14px 0}
.inq b{color:var(--teal)}
.pdfbtn{display:inline-flex;gap:8px;align-items:center;text-decoration:none;background:var(--gold);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px}
@media(max-width:860px){.lbanner{grid-template-columns:1fr}.lbanner .imgs{display:none}.tabs{order:4}.lgrid{grid-template-columns:repeat(2,1fr)}}
.card.lamp .ph{background:#2a0609;aspect-ratio:1/1;overflow:hidden}.card.lamp .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gal.lamp{background:#2a0609}.gal.lamp .main{object-fit:contain;background:#2a0609}
.logo{flex-direction:row!important;align-items:center;gap:10px}.logo img{height:52px;width:52px}.logo .lt{display:flex;flex-direction:column}
.heroLogo{width:min(440px,90%);justify-self:center;filter:drop-shadow(0 0 40px rgba(217,164,65,.35))}
.btn{background:var(--gold)}.hero .btn.ghost{border-color:rgba(217,164,65,.6);color:#f0d79a}
</style>
</head>

<main class="wrap">

 </section>
 <div class="info" id="visit">

  <div><h3 data-t="i2t"></h3><p data-t="i2p"></p></div>
  <div><h3 data-t="i3t"></h3><p>Berliner Str. 143<br>51063 Köln-Mülheim</p></div>
 </div>
</main>

<footer><div class="wrap">
 <div><b>Farbenland</b><p data-t="foot"></p></div>
 <div><h4 data-t="shop"></h4><div id="fcats"></div></div>
 <div><h4 data-t="contact"></h4><p>Farbenland – Orient Kervan</p><p>Berliner Str. 143</p><p>51063 Köln</p></div>
</div></footer>

<div class="ov" id="ov" onclick="if(event.target===this)closeP()"><div class="modal" id="modal"></div></div>
<div class="ov" id="cov" onclick="closeCart()" style="z-index:55"></div>

 <div class="items" id="items"></div>
 <div class="sum" id="sum"></div>

 <div class="price">${eur(v.p)}${v.c&&v.c>v.p?` <s style="font-size:16px;color:var(--mut);font-weight:400">${eur(v.c)}</s>`:''}</div><div class="tax">${t('tax')}</div>
 ${p.v.length>1?`<label>${esc(p.opt||t('choose'))}</label><div class="vars">${p.v.map((x,k)=>`<button class="${k===curV?'on':''} ${x.a?'':'off'}" onclick="selV(${k})">${esc(x.t)}</button>`).join('')}</div>`:''}
 <div class="buy"><div class="qty"><button onclick="curQ=Math.max(1,curQ-1);drawP()">−</button><span>${curQ}</span><button onclick="curQ++;drawP()">+</button></div>
 <button class="add" ${v.a?'':'disabled'} onclick="addCart()">${v.a?t('add'):t('soldBtn')}</button></div>
 <div class="desc">${t('descNote')?`<div class="note">${t('descNote')}</div>`:''}${p.d.map(l=>`<p>${esc(l)}</p>`).join('')}</div></div>`;
}
function selV(k){curV=k;if(cur.v[k].im!=null)curI=cur.v[k].im;drawP()}
function addCart(){const v=cur.v[curV];const e=cart.find(c=>c.vid===v.id);if(e)e.q+=curQ;else cart.push({pid:cur.id,vid:v.id,q:curQ});save();toast(t('added'));closeP();openCart()}
function save(){store.set('fl_cart',cart);drawCart()}
function lines(){return cart.map(c=>{const p=P.find(x=>x.id===c.pid);const v=p&&p.v.find(x=>x.id===c.vid);return p&&v?{c,p,v}:null}).filter(Boolean)}
function drawCart(){const L=lines();const n=L.reduce((a,x)=>a+x.c.q,0),sum=L.reduce((a,x)=>a+x.c.q*x.v.p,0);$('cc').textContent=n;
 $('items').innerHTML=L.length?L.map(({c,p,v})=>`<div class="it"><img src="${src(p.i[v.im??0]||p.i[0])}" alt=""><div><div class="n">${esc(p.n)}</div>${v.t?`<div class="v">${esc(v.t)}</div>`:''}<div class="q"><button onclick="chg(${c.vid},-1)">−</button>${c.q}<button onclick="chg(${c.vid},1)">+</button> <button class="rm" onclick="chg(${c.vid},-999)">${t('remove')}</button></div></div><div class="p">${eur(v.p*c.q)}</div></div>`).join(''):`<div class="empty">${t('empty')}</div>`;
 const SL=L.filter(x=>!x.p.lamp),LL=L.filter(x=>x.p.lamp);
 const link=SHOP+'/cart/'+SL.map(x=>x.v.id+':'+x.c.q).join(',');
 const body=encodeURIComponent('Bestellung Lampen / Lamba siparişi:\n\n'+LL.map(x=>`${x.c.q} x ${x.p.nr} (${eur(x.v.p)})`).join('\n')+'\n\nSumme: '+eur(LL.reduce((a,x)=>a+x.c.q*x.v.p,0))+'\n\nName:\nAdresse:\nTelefon:\n');
 const mail=`mailto:farben-land@web.de?subject=${encodeURIComponent('Lampen-Bestellung Farbenland')}&body=${body}`;
 $('sum').innerHTML=L.length?`<div class="row tot"><span>${t('sub')}</span><span>${eur(sum)}</span></div>
 <div class="ship">${sum>=FREE?t('shipFree'):t('shipLeft').replace('{x}',eur(FREE-sum))}<div class="bar"><i style="width:${Math.min(100,sum/FREE*100)}%"></i></div></div>
 ${SL.length?`<a class="checkout" href="${link}" target="_blank" rel="noopener">${t('checkout')} →</a><div class="pay">${t('pay')}</div>`:''}
 ${LL.length?`<a class="checkout" style="background:var(--teal);margin-top:10px" href="${mail}">${t('lampOrder')} →</a><div class="pay">${t('lampNote')}<br>farben-land@web.de</div>`:''}`:'';
}
function chg(vid,d){const c=cart.find(x=>x.vid===vid);if(!c)return;c.q+=d;if(c.q<1)cart=cart.filter(x=>x!==c);save()}
function openCart(){$('drawer').classList.add('on');$('cov').classList.add('on')}
function closeCart(){$('drawer').classList.remove('on');$('cov').classList.remove('on')}
let tt;function toast(m){$('toast').textContent=m;$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('on'),1800)}
</script>
</body>
</html>
